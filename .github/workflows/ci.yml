name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.13
      - run: uv pip install -e ".[dev]"
      - name: ruff
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: mypy
        run: .venv/bin/mypy
      - name: pytest
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -b --noEmit
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # SundialApp reads the Lambda asset from disk, so synth needs a real build.
      - name: Build the Lambda asset
        working-directory: backend
        run: |
          uv venv --python 3.13
          ./build.sh

      - name: Install CDK dependencies
        working-directory: infra
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: ruff
        working-directory: infra
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: mypy
        working-directory: infra
        run: .venv/bin/mypy app.py sundial_infra tests

      - name: Template assertions
        working-directory: infra
        run: .venv/bin/python -m pytest -q

      # `cdk synth` must pass without AWS credentials: every SSM read is a
      # deploy-time token, never a synth-time lookup (§13).
      - name: cdk synth
        working-directory: infra
        run: PATH=".venv/bin:$PATH" npx --yes aws-cdk@2 synth -q
