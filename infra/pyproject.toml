[project]
name = "sundial-infra"
version = "0.1.0"
description = "Sundial CDK application"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.180",
    "constructs>=10.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "RET", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "constructs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
