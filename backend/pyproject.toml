[project]
name = "sundial"
version = "0.1.0"
description = "Sundial backend — calendar, tasks, and time blocking"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "mangum>=0.19",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "boto3>=1.40",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.125",
    "moto[dynamodb,kms,secretsmanager,ssm]>=5.0",
    "boto3-stubs[dynamodb,kms,secretsmanager,ssm]>=1.40",
    "respx>=0.22",
    # Starlette 1.x's TestClient transports over httpx2; the app itself
    # calls Google through httpx 0.28, which is what respx patches.
    "httpx2>=2.12",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sundial"]

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["sundial"]

[[tool.mypy.overrides]]
module = ["mangum.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]
